      It will be replaced with the URL of the `public` folder during the build.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;500&family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      /* Metric-matched stand-in shown until the web font arrives, so the
         swap doesn't reflow the cover. Measured against the real font
         (average advance over the actual cover copy, vertical metrics). */
      @font-face {
        font-family: 'Atkinson Next Fallback';
        src: local('Arial'), local('ArialMT');
        size-adjust: 100.06%;
        ascent-override: 98.34%;
        descent-override: 31.58%;
        line-gap-override: 0%;
      }
    </style>
    <title>How AI Uses Your Health Data in a Clinical Trial</title>
    <script>
      // Suppress the benign ResizeObserver notification that Scrollama triggers.
      // Must run before the CRA bundle so our listener is registered first.
      window.addEventListener('error', function(e) {
        if (e.message === 'ResizeObserver loop completed with undelivered notifications.') {
          e.stopImmediatePropagation();
          e.preventDefault();
          return false;
        }
      });

      // Always start the story at the top. Otherwise the browser restores the
      // previous scroll position on reload, and because html has
      // scroll-behavior: smooth it animates there, so Scrollama fires every
      // step on the way down and the fingerprint plays them all at once.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>
